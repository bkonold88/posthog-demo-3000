{% extends "base.html" %}

{% block title %}Chat{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2 class="mb-3">HogFlix Chat</h2>
        {% if not chat_enabled %}
        <div class="alert alert-warning">Chat is disabled. Set OPENAI_API_KEY in .env to enable.</div>
        {% endif %}
        <div id="chat-window" class="border rounded p-3 mb-3" style="height: 320px; overflow-y: auto; background: #111; color: #eee;"></div>
        <form id="chat-form" class="form-inline">
            <input id="chat-input" class="form-control mr-2" type="text" placeholder="Type a message..." autocomplete="off" style="width: 75%;" />
            <button id="chat-send" type="submit" class="btn btn-danger">Send</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    function appendMessage(author, text) {
        const div = document.createElement('div');
        div.className = 'mb-2';
        div.innerHTML = `<strong>${author}:</strong> ${text}`;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;
        appendMessage('You', message);
        chatInput.value = '';
        try {
            const res = await fetch("{{ url_for('chat_api') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            if (data && data.message) {
                appendMessage('Assistant', data.message);
            } else if (data && data.error) {
                appendMessage('System', data.error);
            } else {
                appendMessage('System', 'No response');
            }
        } catch (err) {
            appendMessage('System', 'Request failed');
        }
    });
</script>
{% endblock %}
