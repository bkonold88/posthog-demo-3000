{% extends "base.html" %}

{% block title %}Chat{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2 class="mb-3">HogFlix Chat</h2>
        {% if not chat_enabled %}
        <div class="alert alert-warning">Chat is disabled. Set OPENAI_API_KEY in .env to enable.</div>
        {% endif %}
        <div id="chat-window" class="border rounded p-3 mb-3" style="height: 320px; overflow-y: auto; background: #111; color: #eee;"></div>
        <form id="chat-form" class="form-inline">
            <input id="chat-input" class="form-control mr-2" type="text" placeholder="Type a message..." autocomplete="off" style="width: 75%;" />
            <button id="chat-send" type="submit" class="btn btn-danger">Send</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    marked.setOptions({
        gfm: true,
        breaks: true
    });

    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    function renderMarkdown(md) {
        const rawHtml = marked.parse(md || '');
        const safeHtml = DOMPurify.sanitize(rawHtml);
        const container = document.createElement('div');
        container.innerHTML = safeHtml;
        container.querySelectorAll('pre code').forEach((el) => {
            try { hljs.highlightElement(el); } catch (_) {}
        });
        return container;
    }

    function appendMessage(author, text, isMarkdown = false) {
        const wrapper = document.createElement('div');
        wrapper.className = 'mb-3';

        const header = document.createElement('div');
        header.className = 'font-weight-bold mb-1';
        header.textContent = `${author}:`;
        wrapper.appendChild(header);

        const body = document.createElement('div');
        if (isMarkdown) {
            const rendered = renderMarkdown(text);
            body.appendChild(rendered);
        } else {
            body.textContent = text;
        }
        wrapper.appendChild(body);

        chatWindow.appendChild(wrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;
        appendMessage('You', message, false);
        chatInput.value = '';
        try {
            const res = await fetch("{{ url_for('chat_api') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            if (data && data.message) {
                appendMessage('Assistant', data.message, true);
            } else if (data && data.error) {
                appendMessage('System', data.error);
            } else {
                appendMessage('System', 'No response');
            }
        } catch (err) {
            appendMessage('System', 'Request failed');
        }
    });
</script>
{% endblock %}
